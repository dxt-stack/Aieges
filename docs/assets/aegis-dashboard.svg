<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AEGIS command center dashboard preview</title>
  <desc id="desc">Dark dashboard with cyan grid lines, warm gold telemetry, runway cards, and an operational loop panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050708"/><stop offset="1" stop-color="#15121b"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b2022"/><stop offset="1" stop-color="#0b0d0f"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#76f6e4" stroke-opacity=".12"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="632" rx="20" fill="url(#grid)"/>
  <rect x="24" y="24" width="1152" height="70" rx="20" fill="#090b0d" stroke="#76f6e4" stroke-opacity=".22"/>
  <rect x="54" y="44" width="30" height="30" rx="7" fill="#f4ecd8"/>
  <text x="66" y="65" fill="#080808" font-family="monospace" font-size="16" font-weight="800">A</text>
  <text x="102" y="60" fill="#fff" font-family="sans-serif" font-size="20" font-weight="800" letter-spacing="4">AEGIS</text>
  <text x="102" y="78" fill="#e5c98a" font-family="monospace" font-size="10" letter-spacing="2">AUTONOMOUS ECONOMIC INTELLIGENCE</text>
  <rect x="874" y="45" width="120" height="28" rx="14" fill="#d4af37" fill-opacity=".14" stroke="#d4af37"/>
  <circle cx="892" cy="59" r="5" fill="#76f6e4" filter="url(#glow)"/><text x="906" y="63" fill="#f4ecd8" font-family="monospace" font-size="11">STRONG</text>
  <text x="1023" y="63" fill="#76f6e4" font-family="monospace" font-size="11">LIVE / 04:27:18</text>
  <text x="58" y="132" fill="#f4ecd8" font-family="sans-serif" font-size="24" font-weight="700">Operational cockpit</text>
  <text x="58" y="155" fill="#8e999c" font-family="sans-serif" font-size="13">Observe, prioritize, and compound durable value.</text>
  <g fill="url(#panel)" stroke="#76f6e4" stroke-opacity=".22">
    <rect x="58" y="182" width="250" height="122" rx="14"/><rect x="326" y="182" width="250" height="122" rx="14"/><rect x="594" y="182" width="250" height="122" rx="14"/><rect x="862" y="182" width="280" height="122" rx="14"/>
    <rect x="58" y="332" width="520" height="270" rx="14"/><rect x="600" y="332" width="542" height="270" rx="14"/>
  </g>
  <g font-family="monospace"><g fill="#8e999c" font-size="11"><text x="82" y="212">CASH RESERVES</text><text x="350" y="212">NET RUNWAY</text><text x="618" y="212">MONTHLY REVENUE</text><text x="886" y="212">LOOP STATUS</text></g>
  <g fill="#f4ecd8" font-size="26" font-weight="700"><text x="82" y="250">$50,000</text><text x="350" y="250">428.6 DAYS</text><text x="618" y="250">$4,500</text><text x="886" y="250">OBSERVING</text></g>
  <g fill="#76f6e4" font-size="11"><text x="82" y="278">+12.4% buffer</text><text x="350" y="278">FORTRESS TARGET: $250K</text><text x="618" y="278">MRR / MONTH</text><text x="886" y="278">NEXT CYCLE IN 00:42</text></g></g>
  <text x="84" y="368" fill="#e5c98a" font-family="monospace" font-size="12" letter-spacing="2">VALUE CREATION LOOP</text>
  <g font-family="monospace" font-size="11" text-anchor="middle"><g fill="#f4ecd8"><text x="112" y="420">OBSERVE</text><text x="220" y="420">ANALYZE</text><text x="328" y="420">DISCOVER</text><text x="436" y="420">PRIORITIZE</text></g><g stroke="#76f6e4" stroke-width="2" opacity=".7"><path d="M145 416h48M253 416h48M361 416h48"/><path d="M470 416c45 0 45 72-10 72H130c-55 0-55-72-10-72" fill="none"/></g><circle cx="112" cy="416" r="17" fill="#76f6e4" fill-opacity=".15" stroke="#76f6e4"/><circle cx="220" cy="416" r="17" fill="#76f6e4" fill-opacity=".15" stroke="#76f6e4"/><circle cx="328" cy="416" r="17" fill="#76f6e4" fill-opacity=".15" stroke="#76f6e4"/><circle cx="436" cy="416" r="17" fill="#d4af37" fill-opacity=".25" stroke="#d4af37"/></g>
  <text x="626" y="368" fill="#e5c98a" font-family="monospace" font-size="12" letter-spacing="2">SYSTEM SIGNALS</text>
  <g font-family="monospace" font-size="12"><circle cx="630" cy="406" r="4" fill="#76f6e4"/><text x="648" y="410" fill="#d9e2e2">Treasury posture recalculated</text><text x="1060" y="410" fill="#8e999c">00:03</text><circle cx="630" cy="448" r="4" fill="#d4af37"/><text x="648" y="452" fill="#d9e2e2">Opportunity ranked: CloudCostSentinel</text><text x="1060" y="452" fill="#8e999c">00:18</text><circle cx="630" cy="490" r="4" fill="#76f6e4"/><text x="648" y="494" fill="#d9e2e2">Knowledge ledger compounded</text><text x="1060" y="494" fill="#8e999c">00:31</text><circle cx="630" cy="532" r="4" fill="#8f7cff"/><text x="648" y="536" fill="#d9e2e2">Governance queue awaiting review</text><text x="1060" y="536" fill="#8e999c">01:07</text></g>
</svg>
